<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アバター会話</title>
<style>
  :root {
    --bg: #0d1013;
    --panel: rgba(18, 22, 27, 0.86);
    --line: #2a313a;
    --text: #e8ecf1;
    --muted: #93a0ad;
    --accent: #3fa7ff;
    --listen: #3ecf8e;
    --hear: #f5c542;
    --think: #b18cff;
    --speak: #3fa7ff;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
  #stage { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; background: #000; }
  #panel { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 760px; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    backdrop-filter: blur(6px); }
  #top { display: flex; align-items: center; gap: 12px; }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
  #state { font-weight: 600; flex: 1; }
  button { background: #1f2630; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  #log { margin: 10px 0; max-height: 28vh; overflow-y: auto; font-size: 15px; line-height: 1.6; }
  #log p { margin: 4px 0; }
  #log .who { color: var(--muted); margin-right: 6px; }
  #log .note { color: var(--muted); font-size: 13px; }
  #log .err { color: var(--error); font-size: 13px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; background: #11161c; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; font-size: 15px; }
</style>
</head>
<body>
<iframe id="stage" allow="autoplay; fullscreen" title="アバター"></iframe>
<div id="panel">
  <div id="top">
    <span id="dot"></span>
    <span id="state">未接続</span>
    <button id="reset" type="button" disabled>履歴を消す</button>
    <button id="start" type="button" class="primary">会話を始める</button>
  </div>
  <div id="log"></div>
  <form id="ask">
    <input id="text" type="text" placeholder="文字で質問する（待受中のみ）" autocomplete="off" disabled>
    <button id="send" type="submit" disabled>送信</button>
  </form>
</div>
<script>
const signal = `wss://${location.host}/ps-signal`;
document.getElementById('stage').src =
  `/ps/player.html?ss=${encodeURIComponent(signal)}&AutoConnect=true&AutoPlayVideo=true&HoveringMouse=true`;

const STATES = {
  listening: ['待受中 — 話しかけてください', 'var(--listen)'],
  hearing: ['聞いています…', 'var(--hear)'],
  recognizing: ['認識中…', 'var(--think)'],
  thinking: ['考え中…', 'var(--think)'],
  speaking: ['話しています（マイク停止中）', 'var(--speak)'],
};
const $ = (id) => document.getElementById(id);
let ws = null;
let current = '';

function setState(name) {
  current = name;
  const [label, color] = STATES[name] || [name, 'var(--muted)'];
  $('state').textContent = label;
  $('dot').style.background = color;
  const canType = name === 'listening';
  $('text').disabled = !canType;
  $('send').disabled = !canType;
}

function line(who, text, cls) {
  const p = document.createElement('p');
  if (who) {
    const w = document.createElement('span');
    w.className = 'who';
    w.textContent = who;
    p.appendChild(w);
  }
  if (cls) p.className = cls;
  p.appendChild(document.createTextNode(text));
  $('log').appendChild(p);
  $('log').scrollTop = $('log').scrollHeight;
}

async function start() {
  $('start').disabled = true;
  try {
    const media = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    const ctx = new AudioContext({ sampleRate: 16000 });
    await ctx.audioWorklet.addModule('/mic-worklet.js');
    const node = new AudioWorkletNode(ctx, 'mic-pcm');
    ctx.createMediaStreamSource(media).connect(node);
    ws = new WebSocket(`wss://${location.host}/mic`);
    ws.binaryType = 'arraybuffer';
    window.micStats = { chunks: 0, context: ctx };  // for troubleshooting from the console
    node.port.onmessage = (e) => {
      if (ws.readyState === 1) { ws.send(e.data); window.micStats.chunks++; }
    };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'state') setState(m.state);
      else if (m.type === 'transcript') line('あなた', m.text);
      else if (m.type === 'reply') line('香川', m.text);
      else if (m.type === 'info') line('', m.message, 'note');
      else if (m.type === 'error') line('', m.message, 'err');
    };
    ws.onclose = () => {
      setState('未接続');
      $('start').disabled = false;
      $('reset').disabled = true;
      media.getTracks().forEach((t) => t.stop());
      ctx.close();
    };
    $('reset').disabled = false;
  } catch (err) {
    line('', `マイクを開けませんでした: ${err.message}`, 'err');
    $('start').disabled = false;
  }
}

$('start').onclick = start;
$('reset').onclick = () => ws && ws.send(JSON.stringify({ type: 'reset' }));
$('ask').onsubmit = (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || !ws || current !== 'listening') return;
  ws.send(JSON.stringify({ type: 'text', text }));
  $('text').value = '';
};
</script>
</body>
</html>

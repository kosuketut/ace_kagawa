services:
  trtllm-osaka-swallow:
    image: ${TRTLLM_IMAGE:-nvcr.io/nvidia/tensorrt-llm/release:latest}
    container_name: ${TRTLLM_CONTAINER_NAME:-ace-trtllm-osaka-swallow}
    restart: unless-stopped
    runtime: nvidia
    shm_size: "16gb"
    ipc: host
    network_mode: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0,1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-8}
    volumes:
      - /data/ACE:/data/ACE
      - ./qwen3-realtime.yaml:/opt/ace/qwen3-realtime.yaml:ro
    command:
      - bash
      - -lc
      - >
        trtllm-serve serve /data/ACE/models/osaka-swallow-32b-lora-v6-merged
        --host 0.0.0.0
        --port ${TRTLLM_PORT:-8010}
        --tp_size ${TRTLLM_TP_SIZE:-2}
        --tokenizer /data/ACE/models/osaka-swallow-32b-lora-v6-merged
        --served_model_name ${TRTLLM_SERVED_MODEL_NAME:-osaka-swallow-32b-lora-v6-merged}
        --reasoning_parser qwen3
        --extra_llm_api_options /opt/ace/qwen3-realtime.yaml
